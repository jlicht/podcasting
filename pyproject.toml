[project]
name = "podcast-transcriber"
version = "0.1.0"
description = "Transcribe podcasts from file uploads, URLs, or RSS feeds using Whisper"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "python-multipart==0.0.20",
    "openai-whisper==20240930",
    "yt-dlp==2024.12.23",
    "pydantic==2.10.4",
    "jinja2==3.1.5",
    "feedparser==6.0.11",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "httpx==0.28.1",
]

[tool.uv]
# openai-whisper's setup.py uses pkg_resources (bundled in setuptools<71).
# Pin an older setuptools in the build environment so pkg_resources is available.
extra-build-dependencies = { openai-whisper = ["setuptools<71"] }
