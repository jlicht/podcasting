[project]
name = "podcast-transcriber"
version = "0.1.0"
description = "Transcribe podcasts from file uploads, URLs, or RSS feeds using Whisper"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "python-multipart==0.0.20",
    "mlx-whisper>=0.4.0",
    "yt-dlp==2024.12.23",
    "pydantic==2.10.4",
    "jinja2==3.1.5",
    "feedparser==6.0.11",
    "anthropic>=0.49.0",
    "python-docx>=1.1.0",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "httpx==0.28.1",
]
