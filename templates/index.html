<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Podcast Transcriber</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: #f8fafc;
        }

        .subtitle {
            color: #94a3b8;
            margin-bottom: 2rem;
        }

        .tabs {
            display: flex;
            gap: 0;
            margin-bottom: 1.5rem;
            border-bottom: 2px solid #1e293b;
        }

        .tab {
            padding: 0.75rem 1.5rem;
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 0.95rem;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            transition: color 0.2s, border-color 0.2s;
        }

        .tab:hover { color: #e2e8f0; }
        .tab.active { color: #818cf8; border-bottom-color: #818cf8; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            color: #94a3b8;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        input[type="text"], input[type="url"], select {
            width: 100%;
            padding: 0.75rem 1rem;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #e2e8f0;
            font-size: 0.95rem;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #818cf8;
        }

        .file-drop {
            border: 2px dashed #334155;
            border-radius: 12px;
            padding: 3rem 2rem;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
        }

        .file-drop:hover, .file-drop.dragover {
            border-color: #818cf8;
            background: rgba(129, 140, 248, 0.05);
        }

        .file-drop p { color: #94a3b8; margin-top: 0.5rem; font-size: 0.875rem; }
        .file-drop .icon { font-size: 2.5rem; margin-bottom: 0.5rem; }
        .file-drop .filename { color: #818cf8; font-weight: 600; margin-top: 0.75rem; }

        .options-row {
            display: flex;
            gap: 1rem;
        }

        .options-row .form-group { flex: 1; }

        button[type="submit"], .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            background: #818cf8;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button[type="submit"]:hover, .btn:hover { background: #6366f1; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        .result-panel {
            display: none;
            margin-top: 2rem;
            background: #1e293b;
            border-radius: 12px;
            overflow: hidden;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid #334155;
        }

        .result-header h3 { font-size: 1rem; color: #f8fafc; }

        .result-meta {
            display: flex;
            gap: 1rem;
            font-size: 0.8rem;
            color: #94a3b8;
        }

        .result-meta span {
            background: #334155;
            padding: 0.25rem 0.75rem;
            border-radius: 999px;
        }

        .result-actions {
            display: flex;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            border-bottom: 1px solid #334155;
        }

        .btn-sm {
            padding: 0.4rem 0.85rem;
            font-size: 0.8rem;
            background: #334155;
            color: #e2e8f0;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-sm:hover { background: #475569; }

        .transcript-text {
            padding: 1.5rem;
            line-height: 1.8;
            font-size: 0.95rem;
            max-height: 500px;
            overflow-y: auto;
            white-space: pre-wrap;
        }

        .segment {
            padding: 0.5rem 0;
            display: flex;
            gap: 1rem;
        }

        .segment-time {
            color: #818cf8;
            font-size: 0.8rem;
            min-width: 5rem;
            font-variant-numeric: tabular-nums;
            padding-top: 0.15rem;
        }

        .segment-text { flex: 1; }

        .spinner {
            display: none;
            text-align: center;
            padding: 3rem;
        }

        .spinner.active { display: block; }

        .spinner-ring {
            width: 40px;
            height: 40px;
            border: 3px solid #334155;
            border-top-color: #818cf8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .spinner p { color: #94a3b8; font-size: 0.9rem; }

        .error-msg {
            display: none;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 1rem 1.25rem;
            border-radius: 8px;
            margin-top: 1rem;
            font-size: 0.9rem;
        }

        .view-toggle { display: flex; gap: 0; }
        .view-toggle .btn-sm.active { background: #818cf8; color: #fff; }

        .history-list {
            margin-top: 1rem;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.85rem 1.25rem;
            background: #1e293b;
            border-radius: 8px;
            margin-bottom: 0.5rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .history-item:hover { background: #253046; }
        .history-item .name { font-weight: 500; }
        .history-item .lang { color: #94a3b8; font-size: 0.8rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Podcast Transcriber</h1>
        <p class="subtitle">Upload an audio file or paste a URL to transcribe a podcast using Whisper.</p>

        <div class="tabs">
            <button class="tab active" data-tab="upload">Upload File</button>
            <button class="tab" data-tab="url">From URL</button>
            <button class="tab" data-tab="history">History</button>
        </div>

        <!-- Upload Tab -->
        <div id="tab-upload" class="tab-content active">
            <form id="upload-form">
                <div class="form-group">
                    <div class="file-drop" id="file-drop">
                        <div class="icon">&#127911;</div>
                        <div><strong>Drop an audio file here</strong> or click to browse</div>
                        <p>Supports MP3, WAV, M4A, OGG, FLAC, AAC, OPUS (max 500MB)</p>
                        <div class="filename" id="file-name"></div>
                    </div>
                    <input type="file" id="file-input" accept=".mp3,.wav,.m4a,.ogg,.flac,.wma,.aac,.opus" hidden>
                </div>
                <div class="options-row">
                    <div class="form-group">
                        <label for="upload-model">Model Size</label>
                        <select id="upload-model" name="model_size">
                            <option value="tiny">Tiny (fastest, least accurate)</option>
                            <option value="base" selected>Base (good balance)</option>
                            <option value="small">Small (better accuracy)</option>
                            <option value="medium">Medium (high accuracy)</option>
                            <option value="large">Large (best accuracy, slowest)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="upload-lang">Language (optional)</label>
                        <input type="text" id="upload-lang" name="language" placeholder="e.g. en, es, fr (auto-detect if empty)">
                    </div>
                </div>
                <button type="submit" id="upload-btn">Transcribe</button>
            </form>
        </div>

        <!-- URL Tab -->
        <div id="tab-url" class="tab-content">
            <form id="url-form">
                <div class="form-group">
                    <label for="podcast-url">Podcast / Audio URL</label>
                    <input type="url" id="podcast-url" name="url" placeholder="https://example.com/episode.mp3" required>
                </div>
                <div class="options-row">
                    <div class="form-group">
                        <label for="url-model">Model Size</label>
                        <select id="url-model" name="model_size">
                            <option value="tiny">Tiny (fastest, least accurate)</option>
                            <option value="base" selected>Base (good balance)</option>
                            <option value="small">Small (better accuracy)</option>
                            <option value="medium">Medium (high accuracy)</option>
                            <option value="large">Large (best accuracy, slowest)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="url-lang">Language (optional)</label>
                        <input type="text" id="url-lang" name="language" placeholder="e.g. en, es, fr (auto-detect if empty)">
                    </div>
                </div>
                <button type="submit" id="url-btn">Transcribe</button>
            </form>
        </div>

        <!-- History Tab -->
        <div id="tab-history" class="tab-content">
            <div class="history-list" id="history-list">
                <p style="color: #94a3b8;">Loading...</p>
            </div>
        </div>

        <!-- Spinner -->
        <div class="spinner" id="spinner">
            <div class="spinner-ring"></div>
            <p>Transcribing audio... This may take a while for longer files.</p>
        </div>

        <!-- Error -->
        <div class="error-msg" id="error-msg"></div>

        <!-- Result Panel -->
        <div class="result-panel" id="result-panel">
            <div class="result-header">
                <h3 id="result-title">Transcription</h3>
                <div class="result-meta">
                    <span id="result-lang"></span>
                </div>
            </div>
            <div class="result-actions">
                <div class="view-toggle">
                    <button class="btn-sm active" id="btn-plain" onclick="showView('plain')">Plain Text</button>
                    <button class="btn-sm" id="btn-timestamps" onclick="showView('timestamps')">Timestamps</button>
                </div>
                <button class="btn-sm" onclick="copyText()">Copy</button>
                <button class="btn-sm" onclick="downloadText()">Download .txt</button>
                <button class="btn-sm" onclick="downloadSRT()">Download .srt</button>
            </div>
            <div class="transcript-text" id="transcript-text"></div>
        </div>
    </div>

    <script>
        let currentResult = null;
        let currentView = 'plain';

        // Tabs
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
                if (tab.dataset.tab === 'history') loadHistory();
            });
        });

        // File drop zone
        const fileDrop = document.getElementById('file-drop');
        const fileInput = document.getElementById('file-input');
        const fileName = document.getElementById('file-name');

        fileDrop.addEventListener('click', () => fileInput.click());
        fileDrop.addEventListener('dragover', e => { e.preventDefault(); fileDrop.classList.add('dragover'); });
        fileDrop.addEventListener('dragleave', () => fileDrop.classList.remove('dragover'));
        fileDrop.addEventListener('drop', e => {
            e.preventDefault();
            fileDrop.classList.remove('dragover');
            if (e.dataTransfer.files.length) {
                fileInput.files = e.dataTransfer.files;
                fileName.textContent = e.dataTransfer.files[0].name;
            }
        });
        fileInput.addEventListener('change', () => {
            if (fileInput.files.length) fileName.textContent = fileInput.files[0].name;
        });

        // Upload form
        document.getElementById('upload-form').addEventListener('submit', async e => {
            e.preventDefault();
            if (!fileInput.files.length) return;

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            formData.append('model_size', document.getElementById('upload-model').value);
            formData.append('language', document.getElementById('upload-lang').value);

            await transcribe('/transcribe/upload', formData);
        });

        // URL form
        document.getElementById('url-form').addEventListener('submit', async e => {
            e.preventDefault();

            const formData = new FormData();
            formData.append('url', document.getElementById('podcast-url').value);
            formData.append('model_size', document.getElementById('url-model').value);
            formData.append('language', document.getElementById('url-lang').value);

            await transcribe('/transcribe/url', formData);
        });

        async function transcribe(endpoint, formData) {
            const spinner = document.getElementById('spinner');
            const errorMsg = document.getElementById('error-msg');
            const resultPanel = document.getElementById('result-panel');

            spinner.classList.add('active');
            errorMsg.style.display = 'none';
            resultPanel.style.display = 'none';

            document.querySelectorAll('button[type="submit"]').forEach(b => b.disabled = true);

            try {
                const resp = await fetch(endpoint, { method: 'POST', body: formData });
                const data = await resp.json();

                if (!resp.ok) {
                    throw new Error(data.detail || 'Transcription failed');
                }

                currentResult = data;
                showResult(data);
            } catch (err) {
                errorMsg.textContent = err.message;
                errorMsg.style.display = 'block';
            } finally {
                spinner.classList.remove('active');
                document.querySelectorAll('button[type="submit"]').forEach(b => b.disabled = false);
            }
        }

        function showResult(data) {
            const resultPanel = document.getElementById('result-panel');
            document.getElementById('result-title').textContent = data.filename || 'Transcription';
            document.getElementById('result-lang').textContent = 'Language: ' + data.language;
            resultPanel.style.display = 'block';
            showView('plain');
        }

        function showView(view) {
            currentView = view;
            const container = document.getElementById('transcript-text');
            document.getElementById('btn-plain').classList.toggle('active', view === 'plain');
            document.getElementById('btn-timestamps').classList.toggle('active', view === 'timestamps');

            if (view === 'plain') {
                container.textContent = currentResult.text;
            } else {
                container.innerHTML = currentResult.segments.map(seg =>
                    `<div class="segment"><span class="segment-time">${formatTime(seg.start)} - ${formatTime(seg.end)}</span><span class="segment-text">${escapeHtml(seg.text)}</span></div>`
                ).join('');
            }
        }

        function formatTime(seconds) {
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = Math.floor(seconds % 60);
            if (h > 0) return `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
            return `${m}:${String(s).padStart(2, '0')}`;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function copyText() {
            const text = currentView === 'plain'
                ? currentResult.text
                : currentResult.segments.map(s => `[${formatTime(s.start)}] ${s.text}`).join('\n');
            navigator.clipboard.writeText(text);
        }

        function downloadText() {
            const text = currentResult.text;
            download(text, (currentResult.filename || 'transcript') + '.txt', 'text/plain');
        }

        function downloadSRT() {
            const srt = currentResult.segments.map((seg, i) => {
                return `${i + 1}\n${srtTime(seg.start)} --> ${srtTime(seg.end)}\n${seg.text}\n`;
            }).join('\n');
            download(srt, (currentResult.filename || 'transcript') + '.srt', 'text/srt');
        }

        function srtTime(seconds) {
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = Math.floor(seconds % 60);
            const ms = Math.round((seconds % 1) * 1000);
            return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')},${String(ms).padStart(3, '0')}`;
        }

        function download(content, filename, type) {
            const blob = new Blob([content], { type });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
        }

        async function loadHistory() {
            const list = document.getElementById('history-list');
            try {
                const resp = await fetch('/transcriptions');
                const data = await resp.json();
                if (!data.length) {
                    list.innerHTML = '<p style="color: #94a3b8;">No transcriptions yet.</p>';
                    return;
                }
                list.innerHTML = data.map(item => `
                    <div class="history-item" onclick="loadTranscription('${item.job_id}')">
                        <span class="name">${escapeHtml(item.filename)}</span>
                        <span class="lang">${item.language}</span>
                    </div>
                `).join('');
            } catch {
                list.innerHTML = '<p style="color: #fca5a5;">Failed to load history.</p>';
            }
        }

        async function loadTranscription(jobId) {
            try {
                const resp = await fetch('/transcriptions/' + jobId);
                const data = await resp.json();
                currentResult = data;
                showResult(data);
                // Switch back to upload tab visually to show result
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                document.querySelector('[data-tab="upload"]').classList.add('active');
                document.getElementById('tab-upload').classList.add('active');
            } catch {
                alert('Failed to load transcription');
            }
        }
    </script>
</body>
</html>
